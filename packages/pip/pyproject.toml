[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "timeleap-sia-schema"
version = "2.0.0"
description = "Sia schema compiler - generates serialization code from .sia files"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"

[project.scripts]
sia = "timeleap_sia_schema:main"

[project.urls]
Homepage = "https://github.com/TimeleapLabs/sia-schema"
Repository = "https://github.com/TimeleapLabs/sia-schema"
