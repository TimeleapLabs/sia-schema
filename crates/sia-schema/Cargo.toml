[package]
name = "sia-schema"
version = "2.0.0"
edition = "2021"
description = "Sia schema compiler CLI"
license = "MIT"

[[bin]]
name = "sia"
path = "src/main.rs"

[dependencies]
sia-schema-core = { path = "../sia-schema-core" }
sia-schema-lsp = { path = "../sia-schema-lsp" }
clap = { version = "4", features = ["derive"] }
serde_json = { workspace = true }
tokio = { version = "1", features = ["full"] }
