[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "timeleap-sia-schema"
version = "2.0.0"
description = "Sia schema compiler - generates serialization code from .sia files"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Code Generators",
]

[project.urls]
Homepage = "https://github.com/TimeleapLabs/sia-schema"
Repository = "https://github.com/TimeleapLabs/sia-schema"

[tool.maturin]
bindings = "bin"
manifest-path = "crates/sia-schema/Cargo.toml"
module-name = "sia_schema"
python-source = "python"
strip = true
